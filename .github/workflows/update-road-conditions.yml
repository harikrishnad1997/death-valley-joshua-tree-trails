name: Update road conditions

# Pulls the current road conditions from the official NPS conditions pages
# and alerts (Death Valley, Mojave, Joshua Tree) and commits the result to
# _data/road_conditions.json, which the "Road conditions" section on the
# trip page renders. Fully automatic — no manual step.
on:
  schedule:
    # Daily Dec 14-23 at 12:00 UTC = 6:00 AM Central — final prep days + the trip.
    - cron: "0 12 14-23 12 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update road conditions from NPS
        run: python3 scripts/update_road_conditions.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/road_conditions.json
          git diff --cached --quiet || git commit -m "Update road conditions from NPS (auto)"
          git push
